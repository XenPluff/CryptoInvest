name: aureon
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aureon}
      POSTGRES_DB: ${POSTGRES_DB:-aureon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build:
      context: .
      args:
        API_INTERNAL_URL: http://127.0.0.1:4000
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aureon}:${POSTGRES_PASSWORD:?Set a private POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aureon}?schema=public
      API_INTERNAL_URL: http://127.0.0.1:4000
      FUNDING_ENABLED: ${FUNDING_ENABLED:-false}
    ports:
      - 127.0.0.1:${WEB_PORT:-3000}:3000
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
