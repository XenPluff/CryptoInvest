# Preview blueprint. Account signup and repository authorization happen in Render.
services:
  - type: web
    name: aureon-preview
    runtime: docker
    branch: codex/aureon-render-preview
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: API_PORT
        value: "4000"
      - key: API_INTERNAL_URL
        value: http://127.0.0.1:4000
      - key: DATABASE_URL
        fromDatabase:
          name: aureon-preview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: KYC_ENCRYPTION_KEY
        generateValue: true
      - key: FUNDING_ENABLED
        value: "true"

databases:
  - name: aureon-preview-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: aureon
    user: aureon
    ipAllowList: []
