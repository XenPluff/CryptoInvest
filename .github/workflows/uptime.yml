name: AUREON independent uptime
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: aureon-independent-uptime
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check service and report outage or recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUREON_MONITOR_ORIGIN: https://aureon-preview.onrender.com
        run: node .github/scripts/check-uptime.mjs
